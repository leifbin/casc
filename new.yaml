jenkins:
  # authorizationStrategy:
  #   loggedInUsersCanDoAnything:
  #     allowAnonymousRead: false
  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
      - id: "${chart-admin-username}"
        name: "Jenkins Admin"
        password: "${chart-admin-password}"
  disableRememberMe: false
  scmCheckoutRetryCount: 2
  mode: NORMAL
  numExecutors: 0
  labelString: ""
  projectNamingStrategy: "standard"
  markupFormatter:
    plainText
  clouds:
    - kubernetes:
        name: "kubernetes"
        serverUrl: "https://kubernetes.default"
        skipTlsVerify: true
        namespace: "jenkins"
        credentialsId: ""

        # Jenkins Controller Service
        jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"

        # Jenkins Agent Service
        jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"

        containerCapStr: "10"
        connectTimeout: "60"
        readTimeout: "60"
        maxRequestsPerHostStr: "32"

        templates:

          # ============================================================
          # Base
          # ============================================================
          - name: "base"
            namespace: "jenkins"
            label: "base"
            nodeUsageMode: "NORMAL"
            idleMinutes: 0     
            envVars:
              - envVar:
                  key: "TZ"
                  value: "Asia/Shanghai"

            containers:
              - name: "base"
                #image: "swr.ap-southeast-3.myhuaweicloud.com/ppgame-base/builder:base-kubectl-20260911"#版本podman太老
                #image: "swr.ap-southeast-3.myhuaweicloud.com/ppgame-base/builder:base-kubectl-podman-3.4.4-20260915"#没有raync下面的打包加了rsync
                image: "swr.ap-southeast-3.myhuaweicloud.com/ppgame-base/builder:base-kubectl-podman-3.4.4-20260916"
                command: "cat"
                args: ""
                ttyEnabled: true
                privileged: true
                resourceRequestCpu: "1000m"
                resourceLimitCpu: "4000m"
                resourceRequestMemory: "1000Mi"
                resourceLimitMemory: "8192Mi"

              - name: "jnlp"
                image: "docker.io/jenkins/inbound-agent:latest"
                args: "^${computer.jnlpmac} ^${computer.name}"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "400Mi"
                resourceLimitMemory: "1536Mi"

            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false

            # workspaceVolume:
            #   persistentVolumeClaimWorkspaceVolume:
            #     claimName: "jenkins-agent-pvc"
            #     readOnly: false
            yaml: |
              spec:
                activeDeadlineSeconds: 21600

                affinity:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        preference:
                          matchExpressions:
                            - key: type
                              operator: In
                              values:
                                - ci

                tolerations: []

                containers:
                  - name: "base"
                    resources:
                      requests:
                        ephemeral-storage: "5Gi"
                      limits:
                        ephemeral-storage: "50Gi"

                securityContext:
                  fsGroup: 1000

          # ============================================================
          # NodeJS
          # ============================================================
          - name: "nodejs"
            namespace: "jenkins"
            label: "nodejs"
            nodeUsageMode: "EXCLUSIVE"
            idleMinutes: 0
            envVars:
              - envVar:
                  key: "TZ"
                  value: "Asia/Shanghai"

            containers:
              - name: "nodejs"
                image: "docker.io/kubesphere/builder-nodejs:v3.2.0-podman"
                command: "cat"
                args: ""
                ttyEnabled: true
                privileged: true
                resourceRequestCpu: "2000m"
                resourceLimitCpu: "8000m"
                resourceRequestMemory: "4000Mi"
                resourceLimitMemory: "16000Mi"

              - name: "jnlp"
                image: "docker.io/jenkins/inbound-agent:latest"
                args: "^${computer.jnlpmac} ^${computer.name}"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "400Mi"
                resourceLimitMemory: "1536Mi"

            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false

            # workspaceVolume:
            #   persistentVolumeClaimWorkspaceVolume:
            #     claimName: "jenkins-agent-pvc"
            #     readOnly: false

            yaml: |
              spec:
                activeDeadlineSeconds: 21600

                affinity:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        preference:
                          matchExpressions:
                            - key: type
                              operator: In
                              values:
                                - ci

                tolerations: []

                containers:
                  - name: "nodejs"
                    resources:
                      requests:
                        ephemeral-storage: "1Gi"
                      limits:
                        ephemeral-storage: "10Gi"
                    volumeMounts:
                      - name: npm-cache
                        mountPath: /root/.npm
                        subPath: npm
                      - name: yarn-cache
                        mountPath: /root/.yarn
                        subPath: yarn
                      - name: sonar-cache
                        mountPath: /root/.sonar/cache
                        subPath: sonar

                volumes:
                  - name: npm-cache
                    persistentVolumeClaim:
                      claimName: jenkins-agent-pvc
                  - name: yarn-cache
                    persistentVolumeClaim:
                      claimName: jenkins-agent-pvc
                  - name: sonar-cache
                    persistentVolumeClaim:
                      claimName: jenkins-agent-pvc

                securityContext:
                  fsGroup: 1000

          # ============================================================
          # Maven
          # ============================================================
          - name: "maven"
            namespace: "jenkins"
            label: "maven"
            nodeUsageMode: "EXCLUSIVE"
            idleMinutes: 0
            envVars:
              - envVar:
                  key: "TZ"
                  value: "Asia/Shanghai"

            containers:
              - name: "maven"
                image: "docker.io/kubesphere/builder-maven:v3.2.0-podman"
                command: "cat"
                args: ""
                ttyEnabled: true
                privileged: true
                resourceRequestCpu: "1000m"
                resourceLimitCpu: "4000m"
                resourceRequestMemory: "2000Mi"
                resourceLimitMemory: "8192Mi"

              - name: "jnlp"
                image: "docker.io/jenkins/inbound-agent:latest"
                args: "^${computer.jnlpmac} ^${computer.name}"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "400Mi"
                resourceLimitMemory: "1536Mi"

            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false
            # workspaceVolume:
            #   persistentVolumeClaimWorkspaceVolume:
            #     claimName: "jenkins-agent-pvc"
            #     readOnly: false

            yaml: |
              spec:
                activeDeadlineSeconds: 21600

                affinity:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        preference:
                          matchExpressions:
                            - key: type
                              operator: In
                              values:
                                - ci

                tolerations: []

                containers:
                  - name: "maven"
                    resources:
                      requests:
                        ephemeral-storage: "1Gi"
                      limits:
                        ephemeral-storage: "10Gi"

                    volumeMounts:
                      - name: m2-cache
                        mountPath: /root/.m2
                        subPath: m2
                      - name: sonar-cache
                        mountPath: /root/.sonar/cache
                        subPath: sonar
                      - name: gradle-cache               
                        mountPath: /root/.gradle
                        subPath: gradle

                volumes:
                  - name: m2-cache
                    persistentVolumeClaim:
                      claimName: jenkins-agent-pvc
                  - name: sonar-cache
                    persistentVolumeClaim:
                      claimName: jenkins-agent-pvc
                  - name: gradle-cache                  
                    persistentVolumeClaim:
                      claimName: jenkins-agent-pvc

                securityContext:
                  fsGroup: 1000


          # ============================================================
          # cocos
          # ============================================================
          - name: "cocos"
            namespace: "jenkins"
            label: "cocos"
            nodeUsageMode: "EXCLUSIVE"
            idleMinutes: 0
            envVars:
              - envVar:
                  key: "TZ"
                  value: "Asia/Shanghai"

            containers:
              - name: "cocos"
                image: "swr.ap-southeast-3.myhuaweicloud.com/ppgame-base/cocos-builder:v1"
                command: "cat"
                args: ""
                ttyEnabled: true
                privileged: true
                resourceRequestCpu: "1000m"
                resourceLimitCpu: "4000m"
                resourceRequestMemory: "2000Mi"
                resourceLimitMemory: "8192Mi"

              - name: "jnlp"
                image: "docker.io/jenkins/inbound-agent:latest"
                args: "^${computer.jnlpmac} ^${computer.name}"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "400Mi"
                resourceLimitMemory: "1536Mi"

            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false

            # workspaceVolume:
            #   persistentVolumeClaimWorkspaceVolume:
            #     claimName: "jenkins-agent-pvc"
            #     readOnly: false
            yaml: |
              spec:
                activeDeadlineSeconds: 21600

                affinity:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        preference:
                          matchExpressions:
                            - key: type
                              operator: In
                              values:
                                - ci

                tolerations: []

                containers:
                  - name: "cocos"
                    resources:
                      requests:
                        ephemeral-storage: "1Gi"
                      limits:
                        ephemeral-storage: "20Gi"
                        
                securityContext:
                  fsGroup: 1000


          # ============================================================
          # Maven JDK 11
          # ============================================================
          - name: "mavenjdk11"
            label: "jdk11 maven java"
            inheritFrom: "maven"

            containers:
              - name: "maven"
                image: "swr.ap-southeast-3.myhuaweicloud.com/ppgame-base/builder-maven:jdk11-podman-20260819"

          # ============================================================
          # Maven JDK 21
          # ============================================================
          - name: "mavenjdk21"
            label: "jdk21 maven java"
            inheritFrom: "maven"

            containers:
              - name: "maven"
                image: "swr.ap-southeast-3.myhuaweicloud.com/ppgame-base/builder-maven:jdk21-podman-20260717"

          # ============================================================
          # Maven JDK 21
          # ============================================================
          - name: "mavenjdk25"
            label: "jdk25 maven java"
            inheritFrom: "maven"

            containers:
              - name: "maven"
                image: "swr.ap-southeast-3.myhuaweicloud.com/ppgame-base/builder-maven:jdk25-20260922"

          # ============================================================
          # Go
          # ============================================================
          - name: "go"
            namespace: "jenkins"
            label: "go"
            nodeUsageMode: "EXCLUSIVE"
            idleMinutes: 0
            envVars:
              - envVar:
                  key: "TZ"
                  value: "Asia/Shanghai"

            containers:
              - name: "go"
                image: "docker.io/kubesphere/builder-go:v3.2.0-podman"
                command: "cat"
                args: ""
                ttyEnabled: true
                privileged: true
                resourceRequestCpu: "2000m"
                resourceLimitCpu: "8000m"
                resourceRequestMemory: "2000Mi"
                resourceLimitMemory: "16000Mi"
 
              - name: "jnlp"
                image: "docker.io/jenkins/inbound-agent:latest"
                args: "^${computer.jnlpmac} ^${computer.name}"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "400Mi"
                resourceLimitMemory: "1536Mi"

            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false

            # workspaceVolume:
            #   persistentVolumeClaimWorkspaceVolume:
            #     claimName: "jenkins-agent-pvc"
            #     readOnly: false
            yaml: |
              spec:
                activeDeadlineSeconds: 21600

                affinity:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        preference:
                          matchExpressions:
                            - key: type
                              operator: In
                              values:
                                - ci

                tolerations: []
                containers:
                  - name: "go"
                    resources:
                      requests:
                        ephemeral-storage: "1Gi"
                      limits:
                        ephemeral-storage: "10Gi"
                    volumeMounts:
                      - name: go-pkg-cache
                        mountPath: /home/jenkins/go/pkg
                        subPath: hopkg
                      - name: go-pkg-cache2
                        mountPath: /go/pkg
                        subPath: gopkg

                volumes:
                  - name: go-pkg-cache
                    persistentVolumeClaim:
                      claimName: jenkins-agent-pvc
                  - name: go-pkg-cache2
                    persistentVolumeClaim:
                      claimName: jenkins-agent-pvc

                securityContext:
                  fsGroup: 1000

          # ============================================================
          # Go 1.18
          # ============================================================
          - name: "go18"
            label: "go18"
            inheritFrom: "go"

            containers:
              - name: "go"
                image: "docker.io/kubesphere/builder-go:v3.2.2-1.18-podman"

          # ============================================================
          # Python
          # ============================================================
          - name: "python"
            namespace: "jenkins"
            label: "python"
            nodeUsageMode: "EXCLUSIVE"
            idleMinutes: 0
            envVars:
              - envVar:
                  key: "TZ"
                  value: "Asia/Shanghai"


            containers:
              - name: "python"
                image: "docker.io/kubesphere/builder-python:v3.2.0-podman"
                command: "cat"
                args: ""
                ttyEnabled: true
                privileged: true
                resourceRequestCpu: "1000m"
                resourceLimitCpu: "4000m"
                resourceRequestMemory: "100Mi"
                resourceLimitMemory: "8192Mi"

              - name: "jnlp"
                image: "docker.io/jenkins/inbound-agent:latest"
                args: "^${computer.jnlpmac} ^${computer.name}"
                resourceRequestCpu: "100m"
                resourceLimitCpu: "500m"
                resourceRequestMemory: "400Mi"
                resourceLimitMemory: "1536Mi"

            workspaceVolume:
              emptyDirWorkspaceVolume:
                memory: false

            # workspaceVolume:
            #   persistentVolumeClaimWorkspaceVolume:
            #     claimName: "jenkins-agent-pvc"
            #     readOnly: false

            yaml: |
              spec:
                activeDeadlineSeconds: 21600

                affinity:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        preference:
                          matchExpressions:
                            - key: type
                              operator: In
                              values:
                                - ci

                tolerations: []

                containers:
                  - name: "python"
                    resources:
                      requests:
                        ephemeral-storage: "1Gi"
                      limits:
                        ephemeral-storage: "10Gi"
                    volumeMounts:
                      - name: pip-cache
                        mountPath: /root/.cache/pip
                        subPath: pip
                      - name: pipenv-cache
                        mountPath: /root/.local/share/virtualenvs
                      - name: sonar-cache
                        mountPath: /root/.sonar/cache

                volumes:
                  - name: pip-cache
                    persistentVolumeClaim:
                      claimName: jenkins-agent-pvc
                  - name: pipenv-cache
                    hostPath:
                      path: /var/data/jenkins_python_pipenv_cache
                  - name: sonar-cache
                    hostPath:
                      path: /var/data/jenkins_sonar_cache

                securityContext:
                  fsGroup: 1000