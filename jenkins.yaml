jenkins:
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
      - id: "${chart-admin-username}"
        name: "Jenkins Admin"
        password: "${chart-admin-password}"
  disableRememberMe: false
  mode: NORMAL
  numExecutors: 0
  labelString: ""
  projectNamingStrategy: "standard"
  markupFormatter:
    plainText
  clouds:
  - kubernetes:
      containerCapStr: "10"
      defaultsProviderTemplate: ""
      connectTimeout: "5"
      readTimeout: "15"
      jenkinsUrl: "http://jenkins.devops.svc.cluster.local:8080"
      jenkinsTunnel: "jenkins-agent.devops.svc.cluster.local:50000"
      skipTlsVerify: false
      usageRestricted: false
      maxRequestsPerHostStr: "32"
      retentionTimeout: "5"
      waitForPodSec: "600"
      name: "kubernetes"
      namespace: "devops"
      restrictedPssSecurityContext: false
      serverUrl: "https://kubernetes.default"
      credentialsId: ""
      podLabels:
      - key: "jenkins/jenkins-jenkins-agent"
        value: "true"
      templates:
        - name: "default"
          namespace: "devops"
          #id: e3b135fbd9665023f2e26435e3dae1bb6e822e3ee95734d7b1ccf48cd47fa6ef
          containers:
          - name: "jnlp"
            alwaysPullImage: false
            args: "^${computer.jnlpmac} ^${computer.name}"
            envVars:
              - envVar:
                  key: "JENKINS_URL"
                  value: "http://jenkins.devops.svc.cluster.local:8080/"
            image: "jenkins/inbound-agent:latest"
            privileged: "false"
            resourceLimitCpu: 512m
            resourceLimitMemory: 512Mi
            resourceRequestCpu: 512m
            resourceRequestMemory: 512Mi
            ttyEnabled: false
            workingDir: /home/jenkins/agent
          - name: 'kubectl'
            image: 'harbor.slleisure.com/kubesphere/builder-base:v1'
            command: 'cat'  
            ttyEnabled: true
            privileged: true
          - name: 'kaniko'
            image: 'harbor.slleisure.com/env/builder:v1'
            command: 'cat'  
            ttyEnabled: true
            privileged: true

        - name: "golang"
          containers:
          - name: 'golang'
            image: 'golang:1.24-alpine'
            command: 'cat'  # 这里是字符串，而不是列表
            ttyEnabled: true

        - name: "nodejs"
          containers:
          - name: 'nodejs'
            image: 'harbor.slleisure.com/env/builder-nodejs:v3.2.0-podman'
            command: 'cat' 
            ttyEnabled: true

        - name: 'jdk21'
          containers:
            - name: 'jdk21'
              image: 'harbor.slleisure.com/env/builder-maven:jdk21-podman-20240607'
              command: 'cat'
              ttyEnabled: true
              
          idleMinutes: 0
          instanceCap: 2147483647
          label: "jenkins-jenkins-agent"
          nodeUsageMode: "NORMAL"
          podRetention: Never
          showRawYaml: true
          serviceAccount: "default"
          slaveConnectTimeoutStr: "100"
          yamlMergeStrategy: override
          inheritYamlMergeStrategy: false
  slaveAgentPort: 50000
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true
security:
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
    usageStatisticsEnabled: true
unclassified:
  location:
    url: http://jenkins:8080